<!doctype html>

    <meta charset="UTF-8" />
    <!-- Loading favicon (real file so browser never shows default earth icon) -->
    <link rel="icon" id="favicon" type="image/svg+xml" href="/favicon-loading.svg" />
    <script>
      (function() {
        var img = new Image();
        img.onload = function() {
          var link = document.getElementById('favicon');
          if (link) {
            link.href = '/favicon.png?v=2';
            link.type = 'image/png';
          }
        };
        img.src = '/favicon.png';
      })();
    </script>
